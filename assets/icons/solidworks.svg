<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sw-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF384C"/>
      <stop offset="100%" stop-color="#E81628"/>
    </linearGradient>
    <linearGradient id="sw-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE1224"/>
      <stop offset="100%" stop-color="#A50A17"/>
    </linearGradient>
    <linearGradient id="sw-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C20F1F"/>
      <stop offset="100%" stop-color="#7A0510"/>
    </linearGradient>
  </defs>
  <!-- 3D Cube -->
  <polygon points="24,4 43,14 24,24 5,14" fill="url(#sw-top)"/>
  <polygon points="5,14 24,24 24,44 5,34" fill="url(#sw-left)"/>
  <polygon points="24,24 43,14 43,34 24,44" fill="url(#sw-right)"/>
  <!-- Highlight edges -->
  <polyline points="5,14 24,4 43,14" stroke="#FFA3AC" stroke-width="0.8" fill="none"/>
  <line x1="24" y1="4" x2="24" y2="44" stroke="#FFA3AC" stroke-width="0.8"/>
  <!-- SW Text -->
  <text x="14" y="32" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" transform="skewY(18)">S</text>
  <text x="34" y="24" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" transform="skewY(-18)">W</text>
</svg>
