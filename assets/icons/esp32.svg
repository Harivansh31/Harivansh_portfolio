<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- Microchip Body -->
  <rect x="11" y="11" width="26" height="26" rx="4" fill="#0D1117" stroke="#8B9BB4" stroke-width="2"/>
  <rect x="16" y="16" width="16" height="16" rx="2" fill="#11151C" stroke="#343C49" stroke-width="1.2"/>
  <!-- Pins Top -->
  <line x1="16" y1="4" x2="16" y2="11" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="4" x2="24" y2="11" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="4" x2="32" y2="11" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Bottom -->
  <line x1="16" y1="37" x2="16" y2="44" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="37" x2="24" y2="44" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="44" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Left -->
  <line x1="4" y1="16" x2="11" y2="16" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="11" y2="24" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="11" y2="32" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Right -->
  <line x1="37" y1="16" x2="44" y2="16" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="24" x2="44" y2="24" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="32" x2="44" y2="32" stroke="#BFC7D5" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner Circuit / Label -->
  <circle cx="24" cy="24" r="3.5" fill="#FFFFFF"/>
</svg>
